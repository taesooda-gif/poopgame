<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>똥 피하기 게임 - 하드코어</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 10px; color: #ff5555; }
        #gameCanvas {
            border: 4px solid #fff;
            background-color: #5c6b73; /* 다크한 하늘색 */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .instructions {
            margin-top: 10px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h1>💩 똥 피하기 게임 (HARD) 🚽</h1>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div class="instructions">조작: 방향키 (←, →) | 미끄러운 관성 조작 & 빨간 똥 주의!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameOver = false;
        let score = 0;
        let frameCount = 0;
        let difficultyLevel = 1;

        // 플레이어 (물리 가속도 적용)
        const player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 50,
            width: 30,
            height: 40,
            vx: 0,           // 현재 속도 (Velocity)
            acc: 0.8,        // 가속도 (Acceleration)
            friction: 0.88,  // 마찰력 (Inertia/Friction - 1에 가까울수록 더 미끄러짐)
            maxSpeed: 8      // 최대 속도
        };

        let poops = [];
        let toilets = [];

        const keys = { left: false, right: false };

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
            if (gameOver && e.key === " ") restartGame();
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
        });

        // 똥 생성 (일반 똥 & 빠른 빨간 똥)
        function spawnPoop() {
            const isFast = Math.random() < 0.25; // 25% 확률로 특수 똥
            const speed = isFast 
                ? (Math.random() * 3 + 7 + difficultyLevel * 0.8)  // 빠르게 떨어지는 똥
                : (Math.random() * 2 + 4 + difficultyLevel * 0.6); // 일반 똥

            const size = 30;
            const x = Math.random() * (canvas.width - size);
            // 좌우로 흔들리며 떨어지게 하는 변수 (drift)
            const drift = (Math.random() - 0.5) * 1.5;

            poops.push({ x, y: -size, size, speed, drift, isFast });
        }

        // 변기 생성
        function spawnToilet() {
            const size = 35;
            const x = Math.random() * (canvas.width - size);
            toilets.push({ x, y: -size, size, speed: 3.5 });
        }

        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.size &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.size &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function restartGame() {
            gameOver = false;
            score = 0;
            frameCount = 0;
            difficultyLevel = 1;
            poops = [];
            toilets = [];
            player.x = canvas.width / 2 - 15;
            player.vx = 0;
            update();
        }

        function update() {
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#FF4444";
                ctx.font = "bold 36px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#FFF";
                ctx.font = "20px sans-serif";
                ctx.fillText(`최종 점수: ${Math.floor(score)}점`, canvas.width / 2, canvas.height / 2 + 20);
                
                ctx.fillStyle = "#FFD700";
                ctx.font = "16px sans-serif";
                ctx.fillText("스페이스바를 눌러 다시 시작", canvas.width / 2, canvas.height / 2 + 70);
                return;
            }

            frameCount++;
            score += 0.15;

            // 7초(약 420 프레임)마다 난이도 상승 (기존 10초보다 빨라짐)
            if (frameCount % 420 === 0) {
                difficultyLevel += 1;
            }

            // --- 1. 가속도 기반 플레이어 이동 ---
            if (keys.left) {
                player.vx -= player.acc;
            }
            if (keys.right) {
                player.vx += player.acc;
            }

            // 마찰력 적용 (키를 떼거나 반대로 누를 때 묵직하게 감속)
            player.vx *= player.friction;

            // 최대 속도 제한
            if (player.vx > player.maxSpeed) player.vx = player.maxSpeed;
            if (player.vx < -player.maxSpeed) player.vx = -player.maxSpeed;

            // 위치 이동
            player.x += player.vx;

            // 화면 벽 충돌 처리 (튕기지 않고 속도 0으로 멈춤)
            if (player.x < 0) {
                player.x = 0;
                player.vx = 0;
            }
            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
                player.vx = 0;
            }

            // --- 2. 똥 생성 ---
            // 난이도 상승 시 똥 쏟아지는 빈도 대폭 증가
            const spawnInterval = Math.max(6, 30 - difficultyLevel * 2.5);
            if (frameCount % Math.floor(spawnInterval) === 0) {
                spawnPoop();
            }

            // 변기 아이템 (난이도가 높아진 대신 변기도 12초마다 등장)
            if (frameCount % 720 === 0 && Math.random() < 0.7) {
                spawnToilet();
            }

            // --- 3. 똥 업데이트 및 좌우 흔들림 ---
            for (let i = poops.length - 1; i >= 0; i--) {
                poops[i].y += poops[i].speed;
                poops[i].x += poops[i].drift; // 좌우 비스듬히 낙하

                // 벽에 부딪히면 튕김
                if (poops[i].x < 0 || poops[i].x > canvas.width - poops[i].size) {
                    poops[i].drift *= -1;
                }

                if (checkCollision(player, poops[i])) {
                    gameOver = true;
                }

                if (poops[i].y > canvas.height) {
                    poops.splice(i, 1);
                }
            }

            // --- 4. 변기 아이템 업데이트 ---
            for (let i = toilets.length - 1; i >= 0; i--) {
                toilets[i].y += toilets[i].speed;

                if (checkCollision(player, toilets[i])) {
                    toilets.splice(i, 1);
                    poops = []; // 똥 화면 전체 클리어
                } else if (toilets[i].y > canvas.height) {
                    toilets.splice(i, 1);
                }
            }

            // --- 5. 렌더링 ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 바닥
            ctx.fillStyle = "#3a3a3a";
            ctx.fillRect(0, canvas.height - 10, canvas.width, 10);

            // 플레이어
            ctx.font = "32px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("🏃", player.x - 3, player.y + 32);

            // 똥 (일반 똥 / 빠르게 떨어지는 빨간 똥 연출)
            poops.forEach(p => {
                if (p.isFast) {
                    // 빨간 똥은 약간 불타는 듯한 느낌 표현
                    ctx.fillStyle = "#ff2222";
                    ctx.beginPath();
                    ctx.arc(p.x + 15, p.y + 15, 16, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillText("💩", p.x, p.y + p.size);
            });

            // 변기
            toilets.forEach(t => {
                ctx.fillText("🚽", t.x, t.y + t.size);
            });

            // UI
            ctx.fillStyle = "#FFF";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText(`점수: ${Math.floor(score)}`, 15, 30);
            ctx.fillStyle = "#FF5555";
            ctx.fillText(`난이도: LV ${difficultyLevel}`, 15, 55);

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
