<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면 비율 및 터치 확대 방지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>똥 피하기 게임 - 모바일 지원</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* 텍스트 선택 방지 */
            -webkit-user-select: none;
            touch-action: none; /* 모바일 스크롤 및 바운스 방지 */
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }
        h1 { 
            margin: 0 0 10px 0; 
            font-size: 20px; 
            color: #ff5555; 
            text-align: center;
        }
        #gameCanvas {
            border: 3px solid #fff;
            background-color: #5c6b73;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            max-width: 100%;
            max-height: 60vh; /* 모바일 화면 높이 고려 */
        }
        
        /* 모바일 터치 버튼 스타일 */
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-top: 15px;
            gap: 15px;
        }
        .btn {
            flex: 1;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 12px;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
        }
        .btn:active {
            background-color: rgba(255, 255, 255, 0.5);
        }
        .instructions {
            margin-top: 8px;
            font-size: 12px;
            color: #ccc;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>💩 똥 피하기 게임 (HARD) 🚽</h1>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <!-- 모바일 전용 터치 버튼 -->
    <div class="controls">
        <div class="btn" id="btnLeft">◀</div>
        <div class="btn" id="btnRight">▶</div>
    </div>

    <div class="instructions">PC: 방향키(←, →) | 모바일: 하단 버튼 터치</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameOver = false;
        let score = 0;
        let frameCount = 0;
        let difficultyLevel = 1;

        // 플레이어 (물리 가속도 적용)
        const player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 50,
            width: 30,
            height: 40,
            vx: 0,
            acc: 0.9,
            friction: 0.88,
            maxSpeed: 8
        };

        let poops = [];
        let toilets = [];

        const keys = { left: false, right: false };

        // === PC 키보드 이벤트 ===
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
            if (gameOver && (e.key === " " || e.key === "Enter")) restartGame();
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
        });

        // === 모바일 터치 이벤트 ===
        const btnLeft = document.getElementById("btnLeft");
        const btnRight = document.getElementById("btnRight");

        const handleTouchStart = (dir) => (e) => {
            e.preventDefault();
            if (gameOver) {
                restartGame();
                return;
            }
            if (dir === 'left') keys.left = true;
            if (dir === 'right') keys.right = true;
        };

        const handleTouchEnd = (dir) => (e) => {
            e.preventDefault();
            if (dir === 'left') keys.left = false;
            if (dir === 'right') keys.right = false;
        };

        btnLeft.addEventListener("touchstart", handleTouchStart('left'));
        btnLeft.addEventListener("touchend", handleTouchEnd('left'));
        btnRight.addEventListener("touchstart", handleTouchStart('right'));
        btnRight.addEventListener("touchend", handleTouchEnd('right'));

        // 모바일 터치로 게임 재시작 지원 (캔버스 클릭)
        canvas.addEventListener("touchstart", (e) => {
            if (gameOver) {
                e.preventDefault();
                restartGame();
            }
        });

        // 똥 생성
        function spawnPoop() {
            const isFast = Math.random() < 0.25;
            const speed = isFast 
                ? (Math.random() * 3 + 7 + difficultyLevel * 0.8)
                : (Math.random() * 2 + 4 + difficultyLevel * 0.6);

            const size = 30;
            const x = Math.random() * (canvas.width - size);
            const drift = (Math.random() - 0.5) * 1.5;

            poops.push({ x, y: -size, size, speed, drift, isFast });
        }

        // 변기 생성
        function spawnToilet() {
            const size = 35;
            const x = Math.random() * (canvas.width - size);
            toilets.push({ x, y: -size, size, speed: 3.5 });
        }

        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.size &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.size &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function restartGame() {
            gameOver = false;
            score = 0;
            frameCount = 0;
            difficultyLevel = 1;
            poops = [];
            toilets = [];
            player.x = canvas.width / 2 - 15;
            player.vx = 0;
            update();
        }

        function triggerVibration(pattern) {
            if ("vibrate" in navigator) {
                navigator.vibrate(pattern);
            }
        }

        function update() {
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#FF4444";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = "#FFF";
                ctx.font = "20px sans-serif";
                ctx.fillText(`최종 점수: ${Math.floor(score)}점`, canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.fillStyle = "#FFD700";
                ctx.font = "16px sans-serif";
                ctx.fillText("화면이나 버튼을 눌러 다시 시작", canvas.width / 2, canvas.height / 2 + 60);
                return;
            }

            frameCount++;
            score += 0.15;

            if (frameCount % 420 === 0) {
                difficultyLevel += 1;
            }

            // 플레이어 가속도 처리
            if (keys.left) player.vx -= player.acc;
            if (keys.right) player.vx += player.acc;

            player.vx *= player.friction;

            if (player.vx > player.maxSpeed) player.vx = player.maxSpeed;
            if (player.vx < -player.maxSpeed) player.vx = -player.maxSpeed;

            player.x += player.vx;

            if (player.x < 0) {
                player.x = 0;
                player.vx = 0;
            }
            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
                player.vx = 0;
            }

            // 똥 생성
            const spawnInterval = Math.max(6, 30 - difficultyLevel * 2.5);
            if (frameCount % Math.floor(spawnInterval) === 0) {
                spawnPoop();
            }

            // 변기 생성
            if (frameCount % 720 === 0 && Math.random() < 0.7) {
                spawnToilet();
            }

            // 똥 이동 및 충돌
            for (let i = poops.length - 1; i >= 0; i--) {
                poops[i].y += poops[i].speed;
                poops[i].x += poops[i].drift;

                if (poops[i].x < 0 || poops[i].x > canvas.width - poops[i].size) {
                    poops[i].drift *= -1;
                }

                if (checkCollision(player, poops[i])) {
                    gameOver = true;
                    triggerVibration(200); // 충돌 시 0.2초 진동
                }

                if (poops[i].y > canvas.height) {
                    poops.splice(i, 1);
                }
            }

            // 변기 아이템 먹기
            for (let i = toilets.length - 1; i >= 0; i--) {
                toilets[i].y += toilets[i].speed;

                if (checkCollision(player, toilets[i])) {
                    toilets.splice(i, 1);
                    poops = [];
                    triggerVibration([50, 50, 50]); // 변기 아이템 먹을 때 또록 진동
                } else if (toilets[i].y > canvas.height) {
                    toilets.splice(i, 1);
                }
            }

            // 그리기
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#3a3a3a";
            ctx.fillRect(0, canvas.height - 10, canvas.width, 10);

            ctx.font = "32px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("🏃", player.x - 3, player.y + 32);

            poops.forEach(p => {
                if (p.isFast) {
                    ctx.fillStyle = "#ff2222";
                    ctx.beginPath();
                    ctx.arc(p.x + 15, p.y + 15, 16, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillText("💩", p.x, p.y + p.size);
            });

            toilets.forEach(t => {
                ctx.fillText("🚽", t.x, t.y + t.size);
            });

            ctx.fillStyle = "#FFF";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText(`점수: ${Math.floor(score)}`, 15, 30);
            ctx.fillStyle = "#FF5555";
            ctx.fillText(`난이도: LV ${difficultyLevel}`, 15, 55);

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
